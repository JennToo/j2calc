[package]
edition = "2024"
name = "j2calc"
version = "0.1.0"
publish = false

[[bin]]
name = "j2calc"
path = "src/main.rs"
test = false
doctest = false
bench = false

[dependencies]
embassy-embedded-hal = { version = "0.6.0", features = ["defmt"] }
embassy-sync = { version = "0.8.0", features = ["defmt"] }
embassy-executor = { version = "0.10.0", features = ["defmt"] }
embassy-time = { version = "0.5.1", features = ["defmt", "defmt-timestamp-uptime"] }
embassy-rp = { version = "0.10.0", features = [
  "defmt", "unstable-pac", "time-driver", "critical-section-impl", "rp235xa", "binary-info", "executor-thread", "executor-interrupt"
] }
embassy-futures = { version = "0.1.2" }

defmt = "1.0.1"
defmt-rtt = "1.0.0"

cortex-m = { version = "0.7.6", features = ["inline-asm"] }
cortex-m-rt = "0.7.6"
critical-section = "1.1"
panic-probe = { version = "1.0.0", features = ["print-defmt"] }

embedded-hal-1 = { package = "embedded-hal", version = "1.0" }
embedded-hal-async = "1.0"
embedded-hal-bus = { version = "0.1", features = ["async"] }
embedded-io-async = { version = "0.7.0", features = ["defmt"] }
portable-atomic = { version = "1.15", features = ["critical-section"] }
embedded-graphics = "0.8.2"
embedded-graphics-core = "0.4.1"
static_cell = "2.1.1"
embedded-alloc = "0.7.0"

[profile.release]
debug = true

[features]
default = ["defmt"]
defmt = []

[package.metadata.embassy]
build = [
  { target = "thumbv8m.main-none-eabihf", artifact-dir = "j2calc" }
]
